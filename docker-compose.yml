version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: local-supabase-db-mock
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # PII redaction for user documents (see services/redactor). Set REDACTION_SERVICE_URL in the app.
  redactor:
    build: ./services/redactor
    container_name: mate-redactor
    environment:
      REDACTION_SERVICE_TOKEN: ${REDACTION_SERVICE_TOKEN:-}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
